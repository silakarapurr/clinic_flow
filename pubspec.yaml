name: clinic_flow
description: "Production-ready Clinic Management and Appointment System for iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection & Routing
  get_it: ^7.7.0
  go_router: ^14.2.0

  # Backend & Network
  supabase_flutter: ^2.5.6

  # Security & Storage
  flutter_secure_storage: ^9.2.2

  # UI & Presentation
  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
